<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <meta name="description" content="{{ page.description | default(value=site.description) }}">
    <link rel="canonical" href="{{ site.base_url }}{{ page.url | default(value='/') }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/site.css">
    <script defer data-domain="donal.us" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="container nav" aria-label="Main navigation">
        <a class="logo" href="/">Donal<span>Heidenblad</span></a>
        <ul class="navbar">
          <li><a href="/about">About me</a></li>
          <li><a href="/feed.xml">RSS</a></li>
        </ul>
      </nav>
    </header>
    <main id="content">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container"><small>&copy; {{ now() | date(format="%Y") }} {{ site.author }} &middot; Built with <a href="https://seite.sh/">Seite</a></small></div>
    </footer>
  </body>
</html>
